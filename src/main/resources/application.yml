spring:
  application:
    name: ai-code-helper
server:
  port: 8081
  servlet:
    context-path: /api
# LLM provider selection: qwen (default) or minimax
ai:
  provider: qwen
langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key: <Your API Key>
      streaming-chat-model:
        model-name: qwen-max
        api-key: <Your API Key>
      embedding-model:
        model-name: text-embedding-v4
        api-key: <Your API Key>
bigmodel:
  api-key: <Your API Key>
# MiniMax provider config (used when ai.provider=minimax)
minimax:
  api-key: <Your MiniMax API Key>
  model-name: MiniMax-M2.7
  base-url: https://api.minimax.io/v1
