spring:
  application:
    name: ai-code-helper
server:
  port: 8081
  servlet:
    context-path: /api
# Select minimax to enable the MiniMax chat models.
ai:
  provider: qwen
langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key: <Your API Key>
      streaming-chat-model:
        model-name: qwen-max
        api-key: <Your API Key>
      embedding-model:
        model-name: text-embedding-v4
        api-key: <Your API Key>
bigmodel:
  api-key: <Your API Key>
# MiniMax provider config (used when ai.provider=minimax)
minimax:
  api-key: ${MINIMAX_API_KEY:}
  # Choose MiniMax-M3 to use the alternate model.
  model-name: MiniMax-M3.1-Flash
  # Use https://api.minimaxi.com/v1 for the China region.
  base-url: https://api.minimax.io/v1
